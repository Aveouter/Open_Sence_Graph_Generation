name: PR Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by title prefix
        env:
          TOKEN: ${{ secrets.LABELER_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="$PR_TITLE"
          echo "PR title: $TITLE"

          if echo "$TITLE" | grep -qiE '^(fix|bug)'; then
            LABEL="bug"
          elif echo "$TITLE" | grep -qiE '^docs'; then
            LABEL="documentation"
          else
            LABEL="enhancement"
          fi

          API="https://api.github.com/repos/$REPO/issues/$PR_NUM/labels"
          AUTH="Authorization: Bearer $TOKEN"

          # Remove old labels
          for lbl in bug documentation enhancement; do
            curl -fsS -X DELETE -H "$AUTH" "$API/$lbl" 2>/dev/null || true
          done

          # Add the correct label
          echo "Applying label: $LABEL"
          curl -fsS -X POST \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "{\"labels\":[\"$LABEL\"]}" \
            "$API"
