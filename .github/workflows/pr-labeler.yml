name: PR Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by title prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          API="https://api.github.com"
          AUTH="Authorization: Bearer $GH_TOKEN"

          TITLE="$PR_TITLE"
          echo "PR title: $TITLE"

          if echo "$TITLE" | grep -qiE '^(fix|bug)'; then
            LABEL="bug"
          elif echo "$TITLE" | grep -qiE '^docs'; then
            LABEL="documentation"
          else
            LABEL="enhancement"
          fi

          # Remove old tracked labels first to prevent accumulation
          for lbl in bug documentation enhancement; do
            curl -fsS -X DELETE \
              -H "$AUTH" \
              "$API/repos/$REPO/issues/$PR_NUM/labels/$lbl" 2>/dev/null || true
          done

          # Add the correct label via REST API (no git / gh CLI needed)
          echo "Applying label: $LABEL"
          curl -fsS -X POST \
            -H "$AUTH" \
            -H "Content-Type: application/json" \
            -d "{\"labels\":[\"$LABEL\"]}" \
            "$API/repos/$REPO/issues/$PR_NUM/labels"
