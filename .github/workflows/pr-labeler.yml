name: PR Labeler

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by title prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          TITLE="$PR_TITLE"
          echo "PR title: $TITLE"

          if echo "$TITLE" | grep -qiE '^(fix|bug)'; then
            LABEL="bug"
          elif echo "$TITLE" | grep -qiE '^docs'; then
            LABEL="documentation"
          else
            LABEL="enhancement"
          fi

          # Remove old tracked labels first to prevent accumulation
          for lbl in bug documentation enhancement; do
            gh api "repos/$REPO/issues/$PR_NUM/labels/$lbl" -X DELETE 2>/dev/null || true
          done

          echo "Applying label: $LABEL"
          gh pr edit "$PR_NUM" --add-label "$LABEL"
