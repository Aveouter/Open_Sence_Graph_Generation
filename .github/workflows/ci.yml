name: CI

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'utils/**'
      - 'data/**'
      - 'lib/**'
      - 'train.py'
      - 'environment.yml'
      - '.github/workflows/**'
      - 'tools/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'utils/**'
      - 'data/**'
      - 'lib/**'
      - 'train.py'
      - 'environment.yml'
      - '.github/workflows/**'
      - 'tools/**'
      - 'tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Lint — fast (~20s), only on changed Python files
  # ============================================================
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install ruff

      - name: Get changed Python files
        id: changed-files
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "BASE=$BASE"
          echo "HEAD_SHA=$HEAD_SHA"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE..$HEAD_SHA" -- '*.py' | tr '\n' ' ' | xargs)
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"

      - name: Lint + format (ruff — fix dead code, sort imports, check style)
        if: steps.changed-files.outputs.files != ''
        run: |
          echo "Changed files: ${{ steps.changed-files.outputs.files }}"
          # Step 1: auto-fix dead code and sort imports
          ruff check --fix --select F401,F811,I ${{ steps.changed-files.outputs.files }}
          # Step 2: check formatting (non-blocking)
          ruff format --check --diff ${{ steps.changed-files.outputs.files }} || true
          # Step 3: full check (blocking)
          ruff check --select I,B,F ${{ steps.changed-files.outputs.files }}

      - name: Commit auto-fixes back to PR
        if: steps.changed-files.outputs.files != ''
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix unused imports and import order [skip ci]"
          file_pattern: "*.py"

  # ============================================================
  # Job 2: Review — LLM-based bug detection (~30s)
  # ============================================================
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run LLM code review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python tools/ci_review.py

      - name: Post review comment on PR
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUM" ] && [ -f /tmp/review_findings.md ]; then
            gh pr comment "$PR_NUM" --body-file /tmp/review_findings.md
            echo "Review comment posted to PR #$PR_NUM"
          else
            echo "No PR number or no review file — skipping comment"
          fi

  # ============================================================
  # Job 3: Validate — AST-based integrity checks + unit tests
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check if validation needed
        id: check-changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only --diff-filter=ACMRD "$BASE..$HEAD_SHA" 2>/dev/null || true)
          NEEDS_VALIDATE="false"
          for f in $FILES; do
            case "$f" in
              src/*|configs/*|utils/*|tools/*|train.py|data/*|lib/*|tests/*)
                NEEDS_VALIDATE="true"; break ;;
            esac
          done
          echo "needs_validate=$NEEDS_VALIDATE" >> $GITHUB_OUTPUT
          echo "Changed files: $(echo "$FILES" | tr '\n' ' ')"

      - name: Skip validation (no relevant changes)
        if: steps.check-changes.outputs.needs_validate != 'true'
        run: echo "Skipping validation — no src/config/utils/tools changes."

      - name: Run validation script
        if: steps.check-changes.outputs.needs_validate == 'true'
        run: python tools/ci_validate.py

      - name: Run unit tests
        if: steps.check-changes.outputs.needs_validate == 'true'
        run: python -m unittest discover -s tests -v

  # ============================================================
  # Job 4: Smoke Test — slow (~15 min), only on model/config changes
  # ============================================================
  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    if: always() && needs.validate.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if model/method/config code changed
        id: check-changes
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only "$BASE..$HEAD_SHA" 2>/dev/null || true)
          NEEDS_SMOKE="false"
          for f in $FILES; do
            case "$f" in
              src/models/*|src/methods/*|src/core/*|src/losses/*|src/modules/*|\
              configs/*|src/exp.py|train.py)
                NEEDS_SMOKE="true"; break ;;
            esac
          done
          echo "needs_smoke=$NEEDS_SMOKE" >> $GITHUB_OUTPUT
          SINGLE_LINE=$(echo "$FILES" | tr '\n' ' ')
          echo "changed_files=$SINGLE_LINE" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"
          echo "Needs smoke: $NEEDS_SMOKE"

      - name: Skip smoke test (no model/config changes)
        if: steps.check-changes.outputs.needs_smoke != 'true'
        run: echo "Skipping smoke test — no model/config files changed."

      - name: Cache conda packages
        if: steps.check-changes.outputs.needs_smoke == 'true'
        uses: actions/cache@v4
        with:
          path: ~/conda_pkgs
          key: conda-pkgs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environment.yml') }}
          restore-keys: |
            conda-pkgs-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache pip packages
        if: steps.check-changes.outputs.needs_smoke == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-smoke-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environment.yml') }}
          restore-keys: |
            pip-smoke-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore HuggingFace model cache
        if: steps.check-changes.outputs.needs_smoke == 'true'
        id: cache-hf
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-v3-${{ runner.os }}-${{ hashFiles('src/models/flowsg.py', 'src/methods/egtr_method.py', 'src/models/usg.py') }}
          restore-keys: |
            hf-v3-${{ runner.os }}-
            hf-v2-${{ runner.os }}-

      - name: Setup Miniconda
        if: steps.check-changes.outputs.needs_smoke == 'true'
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.10'
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: hsg
          use-mamba: true
          channel-priority: strict

      - name: Install Python dependencies
        if: steps.check-changes.outputs.needs_smoke == 'true'
        shell: bash -el {0}
        run: |
          conda activate hsg
          # CPU-only PyTorch (overrides conda CUDA version)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # Core deps — may already be in conda env but ensure they are present
          pip install lightning numpy scipy pandas tqdm pillow
          # ML / CV deps
          pip install timm transformers fvcore einops
          pip install scikit-image lpips decord xarray pycocotools
          # utils/main_utils.py and others import cv2 (not in environment.yml)
          pip install opencv-python-headless
          # USG backbone (optional — graceful fallback if unavailable)
          pip install open_clip_torch || echo "open_clip_torch skipped"

      - name: Pre-warm HuggingFace models (cache miss)
        if: steps.check-changes.outputs.needs_smoke == 'true' && steps.cache-hf.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          conda activate hsg
          export HF_HOME="$HOME/.cache/huggingface"
          # FlowSG: CLIP ViT-B/16 encoder (~300 MB)
          python -c "
          from transformers import CLIPVisionModel
          CLIPVisionModel.from_pretrained('openai/clip-vit-base-patch16')" 2>&1 ||
            echo "(CLIP pre-warm skipped — network may be unavailable)"
          # EGTR: DeformableDETR config (~200 MB)
          python -c "
          from transformers import AutoConfig
          AutoConfig.from_pretrained('SenseTime/deformable-detr')" 2>&1 ||
            echo "(DETR pre-warm skipped — network may be unavailable)"
          # USG: ConvNeXt-L CLIP backbone (~800 MB, stored under HF cache)
          python -c "
          import open_clip
          open_clip.create_model_and_transforms(
              'convnext_large_d_320', pretrained='laion2b_s29b_b131k_ft_soup')" 2>&1 ||
            echo "(ConvNeXt-L pre-warm skipped — network may be unavailable)"

      - name: Run smoke tests
        if: steps.check-changes.outputs.needs_smoke == 'true'
        shell: bash -el {0}
        run: |
          conda activate hsg
          export HF_HUB_OFFLINE=1
          python tools/ci_smoke_test.py \
            --changed-models "${{ steps.check-changes.outputs.changed_files }}" \
            2>&1 | tee /tmp/smoke_test.log

      - name: Upload smoke test log
        if: always() && steps.check-changes.outputs.needs_smoke == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: /tmp/smoke_test.log
          retention-days: 7
