name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'utils/**'
      - 'train.py'
      - 'environment.yml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'utils/**'
      - 'train.py'
      - 'environment.yml'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Lint — fast (~1 min), always runs
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install ruff

      - name: Lint check (ruff)
        run: ruff check src/ configs/ utils/ train.py tools/

      - name: Format check (ruff)
        run: ruff format --check src/ configs/ utils/ train.py tools/ || true

  # ============================================================
  # Job 2: Validate — medium (~2 min), checks registration integrity
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git diff against base

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run validation script
        run: python tools/ci_validate.py

  # ============================================================
  # Job 3: Smoke Test — slow (~15 min), only on model/config changes
  # ============================================================
  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    # Only run when model/method/config/core files actually changed
    if: |
      always() && needs.validate.result != 'skipped' && needs.validate.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Detect which paths changed to decide if we need the full env
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            models:
              - 'src/models/**'
              - 'src/methods/**'
            configs:
              - 'configs/**'
            core:
              - 'src/core/**'
              - 'src/losses/**'
              - 'src/exp.py'
              - 'train.py'
              - 'data/**'
              - 'lib/**'

      - name: Skip if no relevant changes
        if: |
          steps.changes.outputs.models == 'false' &&
          steps.changes.outputs.configs == 'false' &&
          steps.changes.outputs.core == 'false'
        run: |
          echo "No model/method/config/core changes detected. Skipping smoke test."
          exit 0

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.10'
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: hsg
          use-mamba: true
          channel-priority: strict

      - name: Install CPU-only PyTorch
        shell: bash -el {0}
        run: |
          conda activate hsg
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # lightning may need reinstall after torch change
          pip install lightning

      - name: Run smoke tests
        shell: bash -el {0}
        run: |
          conda activate hsg
          python tools/ci_smoke_test.py --changed-models "${{ steps.changes.outputs.models_files }}"
