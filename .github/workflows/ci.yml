name: CI

permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'utils/**'
      - 'data/**'
      - 'lib/**'
      - 'train.py'
      - 'environment.yml'
      - '.github/workflows/**'
      - 'tools/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'configs/**'
      - 'utils/**'
      - 'data/**'
      - 'lib/**'
      - 'train.py'
      - 'environment.yml'
      - '.github/workflows/**'
      - 'tools/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: Lint — fast (~1 min), only on changed Python files
  # ============================================================
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install ruff

      - name: Get changed Python files
        id: changed-files
        run: |
          # On push events use github.event.before; on PRs use base.sha
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          elif [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="origin/main"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE...HEAD" -- '*.py' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"

      - name: Lint + format (ruff — fix dead code, check style)
        if: steps.changed-files.outputs.files != ''
        run: |
          echo "Changed files: ${{ steps.changed-files.outputs.files }}"
          # Step 1: auto-remove dead code (unused imports etc.)
          # These are objectively bugs — always safe to fix.
          ruff check --fix ${{ steps.changed-files.outputs.files }}
          # Step 2: check style — non-blocking, author decides.
          # Warnings only; formatting is subjective, not auto-committed.
          ruff format --check --diff ${{ steps.changed-files.outputs.files }} || true
          # Step 3: remaining unfixable issues → blocking error
          ruff check ${{ steps.changed-files.outputs.files }}

      - name: Commit dead-code fixes back to PR
        if: steps.changed-files.outputs.files != '' && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-remove unused imports [skip ci]"
          file_pattern: "*.py"

  # ============================================================
  # Job 2: Review — LLM-based bug detection (~30s)
  # ============================================================
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run LLM code review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python tools/ci_review.py

      - name: Post review comment on PR
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -n "$PR_NUM" ] && [ -f /tmp/review_findings.md ]; then
            gh pr comment "$PR_NUM" --body-file /tmp/review_findings.md
            echo "Review comment posted to PR #$PR_NUM"
          else
            echo "No PR number or no review file — skipping comment"
          fi

  # ============================================================
  # Job 3: Validate — medium (~2 min), checks registration integrity
  # ============================================================
  validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run validation script
        run: python tools/ci_validate.py

  # ============================================================
  # Job 4: Smoke Test — slow (~15 min), only on model/config changes
  # ============================================================
  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    if: always() && needs.validate.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if model/config code changed
        id: check-changes
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          elif [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="origin/main"
          fi
          FILES=$(git diff --name-only "$BASE...HEAD" 2>/dev/null || true)
          NEEDS_SMOKE="false"
          for f in $FILES; do
            case "$f" in
              src/models/*|src/methods/*|src/core/*|src/losses/*|configs/*)
                NEEDS_SMOKE="true"; break ;;
              src/exp.py|train.py|data/*|lib/*)
                NEEDS_SMOKE="true"; break ;;
            esac
          done
          echo "needs_smoke=$NEEDS_SMOKE" >> $GITHUB_OUTPUT
          SINGLE_LINE=$(echo "$FILES" | tr '\n' ' ')
          echo "changed_files=$SINGLE_LINE" >> $GITHUB_OUTPUT
          echo "Changed files: $FILES"

      - name: Skip smoke test (no model/config changes)
        if: steps.check-changes.outputs.needs_smoke != 'true'
        run: echo "Skipping smoke test — no model/config files changed."

      - name: Restore HuggingFace model cache
        if: steps.check-changes.outputs.needs_smoke == 'true'
        id: cache-hf
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-v2-${{ runner.os }}-${{ hashFiles('src/models/flowsg.py', 'src/methods/egtr_method.py') }}
          restore-keys: |
            hf-v2-${{ runner.os }}-

      - name: Restore OpenCLIP model cache
        if: steps.check-changes.outputs.needs_smoke == 'true'
        id: cache-openclip
        uses: actions/cache@v4
        with:
          path: ~/.cache/open_clip
          key: openclip-v2-${{ runner.os }}-${{ hashFiles('src/models/usg.py') }}
          restore-keys: |
            openclip-v2-${{ runner.os }}-

      - name: Setup Miniconda
        if: steps.check-changes.outputs.needs_smoke == 'true'
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: '3.10'
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: hsg
          use-mamba: true
          channel-priority: strict

      - name: Install Python dependencies
        if: steps.check-changes.outputs.needs_smoke == 'true'
        shell: bash -el {0}
        run: |
          conda activate hsg
          # CPU-only PyTorch (overrides conda CUDA version)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # Core deps — may already be in conda env but ensure they are present
          pip install lightning numpy scipy pandas tqdm pillow
          # ML / CV deps
          pip install timm transformers fvcore einops
          pip install scikit-image lpips decord xarray pycocotools
          # utils/main_utils.py and others import cv2 (not in environment.yml)
          pip install opencv-python-headless
          # USG backbone (optional — graceful fallback if unavailable)
          pip install open_clip_torch || echo "open_clip_torch skipped"

      - name: Pre-warm HuggingFace models (cache miss)
        if: steps.check-changes.outputs.needs_smoke == 'true' && steps.cache-hf.outputs.cache-hit != 'true'
        shell: bash -el {0}
        env:
          HF_HOME: ~/.cache/huggingface
        run: |
          conda activate hsg
          # FlowSG: CLIP ViT-B/16 encoder (~300 MB)
          python -c "
          from transformers import CLIPVisionModel
          CLIPVisionModel.from_pretrained('openai/clip-vit-base-patch16')" 2>&1 ||
            echo "(CLIP pre-warm skipped — network may be unavailable)"
          # EGTR: DeformableDETR config (~200 MB)
          python -c "
          from transformers import AutoConfig
          AutoConfig.from_pretrained('SenseTime/deformable-detr')" 2>&1 ||
            echo "(DETR pre-warm skipped — network may be unavailable)"

      - name: Pre-warm OpenCLIP models (cache miss)
        if: steps.check-changes.outputs.needs_smoke == 'true' && steps.cache-openclip.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: |
          conda activate hsg
          # USG: ConvNeXt-L CLIP backbone (~800 MB)
          python -c "
          import open_clip
          open_clip.create_model_and_transforms(
              'convnext_large_d_320', pretrained='laion2b_s29b_b131k_ft_soup')" 2>&1 ||
            echo "(ConvNeXt-L pre-warm skipped — network may be unavailable)"

      - name: Run smoke tests
        if: steps.check-changes.outputs.needs_smoke == 'true'
        shell: bash -el {0}
        run: |
          conda activate hsg
          python tools/ci_smoke_test.py --skip-train --changed-models "${{ steps.check-changes.outputs.changed_files }}"
