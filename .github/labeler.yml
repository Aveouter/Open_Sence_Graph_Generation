# PR Labeler configuration
# Labels are applied based on changed file paths.
# sync-labels: true — labels are removed when no matching files changed.

module:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/**'

config:
  - changed-files:
    - any-glob-to-any-file: 'configs/**'

ci:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**'
      - 'tools/ci_*.py'

utils:
  - changed-files:
    - any-glob-to-any-file: 'utils/**'

docs:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - 'docs/**'
