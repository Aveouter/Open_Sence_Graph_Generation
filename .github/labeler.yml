# PR Labeler — maps changed files to existing repo labels

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - 'docs/**'

enhancement:
  - changed-files:
    - any-glob-to-any-file:
      - 'src/**'
      - 'configs/**'
      - 'utils/**'
      - 'tools/**'
      - 'data/**'
      - 'lib/**'
      - '.github/**'
